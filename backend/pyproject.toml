[project]
name = "ai-bridge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0", "sqlalchemy>=2.0.0", "openai>=1.50.0",
  "anthropic>=0.37.0", "google-genai>=1.0.0"
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
